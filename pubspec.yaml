name: asaspp_app
description: Application mobile du club de plongée ASASPP.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  flutter_map: ^5.0.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  webview_flutter: ^4.12.0
  maplibre_gl: ^0.25.0
  go_router: ^17.0.1
  circle_nav_bar: ^2.2.0
  flutter_card_swiper: ^7.2.0
  photo_view: ^0.15.0
  flutter_staggered_grid_view: ^0.7.0
  animations: ^2.1.1
  intl: ^0.20.2
  shimmer: ^3.0.0
  equatable: ^2.0.8
  image_picker: ^1.0.7
  url_launcher: ^6.3.2
  flutter_animate: ^4.5.2
  dio: ^5.10.0
  shared_preferences: ^2.5.5



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/jpgs/
    - assets/lotties/
    - assets/pngs/
    - assets/gallery/
    - assets/annonces/

# ⚠️ configuration flutter_native_splash
flutter_native_splash:
  color: "#0A6FD8"
  image: assets/jpgs/logo_asaspp.jpeg

  android_12:
    color: "#0A6FD8"
    image: assets/jpgs/logo_asaspp.jpeg
